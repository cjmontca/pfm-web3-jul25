version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wine-traceability-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FABRIC_NETWORK_PATH=/app/fabric-network
      - CHANNEL_NAME=wine-traceability-channel
      - JWT_SECRET=wine-traceability-jwt-secret-key-2024
      - JWT_EXPIRE=24h
      - BCRYPT_ROUNDS=12
      - LOG_LEVEL=info
    volumes:
      - ./fabric-network:/app/fabric-network:ro
      - backend-logs:/app/logs
    networks:
      - wine-traceability-app
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wine-traceability-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    networks:
      - wine-traceability-app
    restart: unless-stopped
    depends_on:
      - backend

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: wine-traceability-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=wineadmin
      - MONGO_INITDB_ROOT_PASSWORD=winepass2024
      - MONGO_INITDB_DATABASE=wine_traceability
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - wine-traceability-app
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wine-traceability-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redispass2024
    volumes:
      - redis-data:/data
    networks:
      - wine-traceability-app
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: wine-traceability-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - wine-traceability-app
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: wine-traceability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - wine-traceability-app
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: wine-traceability-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana2024
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - wine-traceability-app
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  mongodb-data:
  redis-data:
  backend-logs:
  nginx-logs:
  prometheus-data:
  grafana-data:

networks:
  wine-traceability-app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16