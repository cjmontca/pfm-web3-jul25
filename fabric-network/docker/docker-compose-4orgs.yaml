version: '3.7'

volumes:
  orderer.wine-traceability.com:
  peer0.vineyard.wine-traceability.com:
  peer1.vineyard.wine-traceability.com:
  peer0.winery.wine-traceability.com:
  peer1.winery.wine-traceability.com:
  peer0.distributor.wine-traceability.com:
  peer1.distributor.wine-traceability.com:
  peer0.consumer.wine-traceability.com:
  peer1.consumer.wine-traceability.com:

networks:
  wine-traceability:
    name: wine-traceability

services:

  orderer.wine-traceability.com:
    container_name: orderer.wine-traceability.com
    image: hyperledger/fabric-orderer:2.2
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_CHANNELPARTICIPATION_ENABLED=false
      - ORDERER_ADMIN_TLS_ENABLED=false
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer.wine-traceability.com:9443
      - ORDERER_METRICS_PROVIDER=prometheus
      - ORDERER_CONSENSUS_TYPE=solo
      - FABRIC_CFG_PATH=/var/hyperledger/orderer
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
        - ../organizations/orderer-org/orderers/orderer.wine-traceability.com/msp:/var/hyperledger/orderer/msp
        - ../organizations/orderer-org/orderers/orderer.wine-traceability.com/tls/:/var/hyperledger/orderer/tls
        - ../config/orderer.yaml:/var/hyperledger/orderer/orderer.yaml
        - ../genesis.block:/var/hyperledger/orderer/genesis.block
        - orderer.wine-traceability.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
      - 9443:9443
    networks:
      - wine-traceability

  peer0.vineyard.wine-traceability.com:
    container_name: peer0.vineyard.wine-traceability.com
    image: hyperledger/fabric-peer:2.2
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=wine-traceability
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.vineyard.wine-traceability.com
      - CORE_PEER_ADDRESS=peer0.vineyard.wine-traceability.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.vineyard.wine-traceability.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.vineyard.wine-traceability.com:7151
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.vineyard.wine-traceability.com:7051
      - CORE_PEER_LOCALMSPID=VineyardOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.vineyard.wine-traceability.com:9444
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0vineyard"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.vineyard:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
        - /var/run/:/host/var/run/
        - ../organizations/vineyard-org/peers/peer0.vineyard.wine-traceability.com/msp:/etc/hyperledger/fabric/msp
        - ../organizations/vineyard-org/peers/peer0.vineyard.wine-traceability.com/tls:/etc/hyperledger/fabric/tls
        - peer0.vineyard.wine-traceability.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
